packages:
  - bundles/**

allowBuilds:
  '@ffprobe-installer/darwin-arm64': true
  '@ffprobe-installer/linux-x64': true
  '@parcel/watcher': true
  '@serialport/bindings-cpp': true
  '@tsparticles/engine': true
  '@vaadin/vaadin-usage-statistics': true
  better-sqlite3: true
  core-js-pure: true
  msgpackr-extract: true
  unrs-resolver: true
  vuex-module-decorators: true

minimumReleaseAgeExclude:
  - '@types/node@26.6.3'
  - '@ewanlyon/vite-plugin-nodecg@2.1.0'
